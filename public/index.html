  <body>
    <h1 id="title" class="titles">
      Shopping List
    </h1>
    <form class="form1" method="POST">
      <input class="listinput" type='text' id='item' placeholder='Item?'>
      <br>
      <input class="listinput" id='count' placeholder='Cost? $' type="number" min="0">
      <br>
      <input class="listinput" id='cost' placeholder='How many?' type="number" name="quantity" min="0" step="1">
      <br>
      <button class="submitbutton">Submit</button>
    </form>
    <h2 hidden id="tdisp" class="titles"></h2>
  </body>
